name: GhostTap Windows Build Audit

on:
  push:
    branches:
      - "fix/ghosttap-1.3.3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-audit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Extract GhostTap release
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "GhostTap_Unified_WhatsApp_Watch_VSCode_1.3.2_FINAL.zip"
          if (-not (Test-Path $zip)) { throw "GhostTap ZIP not found: $zip" }
          $dest = Join-Path $env:GITHUB_WORKSPACE "extracted"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Get-ChildItem -Path $dest -Recurse | Select-Object FullName

      - name: Locate solution
        id: locate
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\extracted" -Filter "*.sln" -Recurse | Select-Object -First 1
          if (-not $sln) { throw "No solution found after extraction." }
          "solution=$($sln.FullName)" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          dotnet restore "${{ steps.locate.outputs.solution }}"

      - name: Build Release
        shell: pwsh
        run: |
          dotnet build "${{ steps.locate.outputs.solution }}" -c Release --no-restore --nologo

      - name: Create extracted source archive
        if: always()
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\extracted\*" -DestinationPath "$env:GITHUB_WORKSPACE\ghosttap-extracted-source.zip" -Force

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghosttap-build-audit
          path: |
            ghosttap-extracted-source.zip
